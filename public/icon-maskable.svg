
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Royal Blue Gradient -->
    <linearGradient id="bgGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#123CE6" />
      <stop offset="35%" stop-color="#0A28C2" />
      <stop offset="70%" stop-color="#051B9A" />
      <stop offset="100%" stop-color="#021074" />
    </linearGradient>

    <!-- Subtle Radial Top Highlight -->
    <radialGradient id="topGlow" cx="256" cy="60" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B66FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#123CE6" stop-opacity="0" />
    </radialGradient>

    <!-- Emblem Subtle 3D Top-to-Bottom White/Pearl Gradient -->
    <linearGradient id="emblemPearl" x1="256" y1="60" x2="256" y2="390" gradientUnits="userSpaceOnUse">
