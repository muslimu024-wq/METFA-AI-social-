    <!-- Emblem Drop Shadow for 3D Floating Effect -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#010838" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Inner Bevel Lighting -->
